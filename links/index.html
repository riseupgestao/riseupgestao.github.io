<style>
/* Layout: coluna única de 460px centralizada; logo, frase e botões empilhados, linhas finas douradas. */
:root{
  color-scheme: dark;
  --azul:#0D1B2A; --azul-alt:#16283D; --dourado:#D4AF37; --linha:rgba(212,175,55,.45);
  --branco:#FFFFFF; --texto:#F2EDE6; --texto-suave:#C5CCD4;
  --display:Cinzel,"Trajan Pro",Georgia,serif; --sans:Montserrat,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--azul);color:var(--texto);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:48px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:28px}
.logo{width:210px;height:88px;object-fit:contain}
.intro{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.intro p{margin:0;font-family:var(--display);font-size:1.12rem;color:var(--branco);text-wrap:balance}
.intro small{font-size:.72rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--dourado)}
.rule{width:56px;height:2px;background:var(--dourado)}
.links{width:100%;display:flex;flex-direction:column;gap:14px}
.btn{display:grid;grid-template-columns:28px 1fr 20px;align-items:center;gap:16px;min-height:72px;padding:14px 20px;border:1px solid var(--dourado);background:var(--azul-alt);color:var(--branco);text-decoration:none;transition:background .25s,transform .25s}
.btn:hover{background:rgba(212,175,55,.14);transform:translateY(-2px)}
.btn:focus-visible,.mini a:focus-visible{outline:2px solid var(--dourado);outline-offset:3px}
.btn strong{display:block;font-size:.92rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.btn span span{display:block;font-size:.84rem;color:var(--texto-suave)}
.btn.principal{background:var(--dourado);color:var(--azul)}
.btn.principal span span{color:#2B3A4D}
.btn.principal:hover{background:#E3C257}
.mini{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 24px;padding-top:20px;border-top:1px solid var(--linha);width:100%}
.mini a{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:.86rem;text-decoration:none;color:var(--texto)}
.mini a:hover{color:var(--dourado)}
footer{margin-top:auto;padding-top:8px;text-align:center;font-size:.76rem;color:var(--texto-suave)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
